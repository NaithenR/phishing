<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- mobile devices !--> 

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
        }

        /* banking name */
        .navbar {
            background: #1f3c88;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
        }

        /* centering of login box */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 100px);
        }

        .login-box {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #1f3c88;
        }

        .login-box label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .login-box button {
            width: 106%;
            padding: 12px;
            margin-top: 40px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #163172;
        }

    </style>
</head>

<body>
    
    <!-- Fake Bank Name -->
    <div class="navbar">
        Cybersecurity Bank
    </div>

    <div class="container">
        <div class="login-box">
            <h2>Account Login</h2>

            <form action="/login" method="POST">
                <label for="username">Username</label>
                <input type="text" id="username" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Log In</button>
            </form>
            
        </div>
    </div>

</body>
</html>
